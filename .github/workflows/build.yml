name: Build AdSpeedHack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Runtime.m"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install ldid

          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$HOME/theos"

      - name: Build AdSpeedHack
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"

          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [ -z "$VERSION" ]; then
            echo "VERSION is empty."
            exit 1
          fi

          make clean
          make

          DYLIB="$(find .theos -type f -name 'AdSpeedHack.dylib' \
            ! -path '*.dSYM/*' \
            | head -n 1 || true)"

          if [ -z "$DYLIB" ]; then
            echo "AdSpeedHack.dylib was not produced."
            find .theos -maxdepth 8 -type f -print || true
            exit 1
          fi

          echo "Using dylib: $DYLIB"

          mkdir -p output

          OUT="output/AdSpeedHack_ver.${VERSION}.dylib"
          cp "$DYLIB" "$OUT"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

          file "$OUT"
          lipo -info "$OUT" || true
          ls -lh "$OUT"

      - name: Upload AdSpeedHack
        uses: actions/upload-artifact@v4
        with:
          name: AdSpeedHack_ver.${{ env.VERSION }}
          path: ${{ env.OUT }}
          if-no-files-found: error
